<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Генератор идей для постов</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: Georgia, "Times New Roman", serif;
      background: #f4f1ea;
      color: #2c2a26;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
    }

    main {
      width: min(560px, 100%);
      background: #fffdf8;
      border: 1px solid #e4ddd0;
      border-radius: 12px;
      padding: 40px 36px;
    }

    h1 {
      font-size: 1.75rem;
      font-weight: 400;
      letter-spacing: -0.02em;
      margin-bottom: 24px;
    }

    ul {
      list-style: disc;
      padding-left: 1.25em;
      line-height: 1.8;
      font-size: 1.05rem;
    }

    li + li {
      margin-top: 8px;
    }
  </style>
</head>
<body>
  <main>
    <h1>Генератор идей для постов</h1>
    <ul>
      <li>5 идей постов для экспертов</li>
      <li>3 идеи сторис на сегодня</li>
      <li>контент план на неделю</li>
    </ul>
  </main>
</body>
</html>
