<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Генератор идей для постов</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,600&family=Outfit:wght@400;500&display=swap" rel="stylesheet">
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    :root {
      --ink: #14110e;
      --paper: #f3ead8;
      --gold: #e0b35a;
      --muted: #c9bba6;
    }

    body {
      font-family: Outfit, system-ui, sans-serif;
      background: var(--ink);
      color: var(--paper);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
      overflow: hidden;
    }

    .glow {
      position: fixed;
      width: 42vw;
      height: 42vw;
      border-radius: 50%;
      filter: blur(80px);
      opacity: 0.35;
      pointer-events: none;
      animation: drift 14s ease-in-out infinite alternate;
    }

    .glow--a {
      background: #5a3a12;
      top: -12vw;
      left: -8vw;
    }

    .glow--b {
      background: #1e3a3a;
      right: -10vw;
      bottom: -14vw;
      animation-delay: -6s;
      animation-duration: 18s;
    }

    main {
      position: relative;
      width: min(560px, 100%);
      padding: 48px 40px;
      background: linear-gradient(160deg, rgba(255, 247, 232, 0.08), rgba(255, 247, 232, 0.03));
      border: 1px solid rgba(243, 234, 216, 0.14);
      border-radius: 20px;
      backdrop-filter: blur(16px);
      box-shadow: 0 30px 80px rgba(0, 0, 0, 0.35);
      animation: rise 0.9s cubic-bezier(0.16, 1, 0.3, 1) both;
    }

    .eyebrow {
      display: inline-block;
      font-size: 0.72rem;
      letter-spacing: 0.22em;
      text-transform: uppercase;
      color: var(--gold);
      margin-bottom: 14px;
      animation: fade 0.8s ease 0.15s both;
    }

    h1 {
      font-family: Fraunces, Georgia, serif;
      font-size: clamp(1.8rem, 4vw, 2.35rem);
      font-weight: 400;
      line-height: 1.2;
      letter-spacing: -0.03em;
      margin-bottom: 28px;
      animation: fade 0.9s ease 0.25s both;
    }

    .rule {
      height: 1px;
      background: linear-gradient(90deg, var(--gold), transparent);
      margin-bottom: 28px;
      transform-origin: left;
      animation: draw 0.8s ease 0.45s both;
    }

    ol {
      list-style: none;
      display: grid;
      gap: 12px;
    }

    li {
      display: grid;
      grid-template-columns: auto 1fr;
      gap: 14px;
      align-items: center;
      padding: 14px 16px;
      border-radius: 12px;
      background: rgba(255, 247, 232, 0.04);
      border: 1px solid transparent;
      cursor: default;
      animation: slide 0.7s cubic-bezier(0.16, 1, 0.3, 1) both;
      transition: transform 0.35s ease, background 0.35s ease, border-color 0.35s ease;
    }

    li:nth-child(1) { animation-delay: 0.55s; }
    li:nth-child(2) { animation-delay: 0.7s; }
    li:nth-child(3) { animation-delay: 0.85s; }

    li:hover {
      transform: translateX(6px);
      background: rgba(224, 179, 90, 0.1);
      border-color: rgba(224, 179, 90, 0.28);
    }

    .num {
      width: 34px;
      height: 34px;
      display: grid;
      place-items: center;
      border-radius: 50%;
      font-family: Fraunces, Georgia, serif;
      font-size: 0.95rem;
      color: var(--ink);
      background: var(--gold);
      transition: transform 0.35s ease;
    }

    li:hover .num {
      transform: rotate(-8deg) scale(1.08);
    }

    .label {
      font-size: 1.05rem;
      font-weight: 400;
      color: var(--paper);
    }

    @keyframes drift {
      from { transform: translate3d(0, 0, 0) scale(1); }
      to { transform: translate3d(40px, 30px, 0) scale(1.15); }
    }

    @keyframes rise {
      from { opacity: 0; transform: translateY(28px) scale(0.98); }
      to { opacity: 1; transform: translateY(0) scale(1); }
    }

    @keyframes fade {
      from { opacity: 0; transform: translateY(10px); }
      to { opacity: 1; transform: translateY(0); }
    }

    @keyframes draw {
      from { transform: scaleX(0); opacity: 0; }
      to { transform: scaleX(1); opacity: 1; }
    }

    @keyframes slide {
      from { opacity: 0; transform: translateX(-16px); }
      to { opacity: 1; transform: translateX(0); }
    }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after {
        animation: none !important;
        transition: none !important;
      }
    }
  </style>
</head>
<body>
  <div class="glow glow--a" aria-hidden="true"></div>
  <div class="glow glow--b" aria-hidden="true"></div>
  <main>
    <p class="eyebrow">для авторов</p>
    <h1>Генератор идей для постов</h1>
    <div class="rule" aria-hidden="true"></div>
    <ol>
      <li>
        <span class="num">1</span>
        <span class="label">5 идей постов для экспертов</span>
      </li>
      <li>
        <span class="num">2</span>
        <span class="label">3 идеи сторис на сегодня</span>
      </li>
      <li>
        <span class="num">3</span>
        <span class="label">контент план на неделю</span>
      </li>
    </ol>
  </main>
</body>
</html>
